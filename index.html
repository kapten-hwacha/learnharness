<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
		<meta name="color-scheme" content="light dark" />
		<title>Learning Harness</title>
		<script>
			if (typeof globalThis !== "undefined") {
				if (typeof globalThis.global === "undefined") {
					globalThis.global = globalThis;
				}
				(function() {
					var listeners = {};
					var p = globalThis.process || {};
					p.env = p.env || {};
					p.platform = p.platform || (navigator.userAgent.includes("Win") ? "win32" : navigator.userAgent.includes("Mac") ? "darwin" : "linux");
					p.versions = p.versions || { node: "20.0.0" };
					p.cwd = p.cwd || function() { return "/"; };
					p.nextTick = p.nextTick || function(fn) { setTimeout(fn, 0); };
					p.on = p.on || function(evt, fn) { (listeners[evt] = listeners[evt] || []).push(fn); return p; };
					p.addListener = p.addListener || p.on;
					p.once = p.once || function(evt, fn) {
						var wrap = function() { p.removeListener(evt, wrap); fn.apply(null, arguments); };
						return p.on(evt, wrap);
					};
					p.removeListener = p.removeListener || function(evt, fn) {
						var l = listeners[evt];
						if (l) { var idx = l.indexOf(fn); if (idx !== -1) l.splice(idx, 1); }
						return p;
					};
					p.off = p.off || p.removeListener;
					p.emit = p.emit || function(evt) {
						var l = listeners[evt];
						if (!l) return false;
						var args = Array.prototype.slice.call(arguments, 1);
						l.slice().forEach(function(fn) { try { fn.apply(null, args); } catch(e) {} });
						return true;
					};
					p.listeners = p.listeners || function(evt) { return (listeners[evt] || []).slice(); };
					p.removeAllListeners = p.removeAllListeners || function(evt) { if (evt) delete listeners[evt]; else listeners = {}; return p; };
					globalThis.process = p;
				})();
			}
			if (typeof window !== "undefined") {
				window.global = window;
			}
			(function () {
				try {
					var m = window.matchMedia("(prefers-color-scheme: dark)").matches;
					var r = document.documentElement;
					r.classList.add(m ? "dark" : "light");
					r.style.colorScheme = m ? "dark" : "light";
				} catch (e) {}
			})();
			window.addEventListener("error", function (e) {
				var msg = e.error ? (e.error.stack || e.error.message) : (e.message || String(e));
				console.error("[LH Boot Error]", msg);
				var el = document.getElementById("lh-boot-error-overlay");
				if (!el) {
					el = document.createElement("div");
					el.id = "lh-boot-error-overlay";
					el.style.cssText = "position:fixed;top:0;left:0;right:0;bottom:0;background:#1e1e1e;color:#ff5555;z-index:999999;padding:24px;font-family:monospace;white-space:pre-wrap;overflow:auto;font-size:14px;line-height:1.4;";
					(document.body || document.documentElement).appendChild(el);
				}
				el.textContent = "LearnHarness Boot Error:\n\n" + msg;
			});
			window.addEventListener("unhandledrejection", function (e) {
				var msg = e.reason ? (e.reason.stack || e.reason.message || String(e.reason)) : String(e);
				console.error("[LH Boot Unhandled Rejection]", msg);
				var el = document.getElementById("lh-boot-error-overlay");
				if (!el) {
					el = document.createElement("div");
					el.id = "lh-boot-error-overlay";
					el.style.cssText = "position:fixed;top:0;left:0;right:0;bottom:0;background:#1e1e1e;color:#ff5555;z-index:999999;padding:24px;font-family:monospace;white-space:pre-wrap;overflow:auto;font-size:14px;line-height:1.4;";
					(document.body || document.documentElement).appendChild(el);
				}
				el.textContent = "LearnHarness Boot Unhandled Rejection:\n\n" + msg;
			});
		</script>
	</head>
	<body class="min-h-dvh antialiased">
		<div id="root"></div>
		<script type="module" src="/src/client/main.tsx"></script>
	</body>
</html>
