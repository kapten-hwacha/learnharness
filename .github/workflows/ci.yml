name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Typecheck, tests, lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - name: Validate iOS configuration
        run: |
          node -e '
            const fs = require("fs");
            const conf = JSON.parse(fs.readFileSync("src-tauri/tauri.ios.conf.json", "utf8"));
            if (!conf.bundle?.iOS) throw new Error("Missing bundle.iOS config");
            if (!conf.app?.windows?.[0]?.fullscreen) throw new Error("iOS window must be fullscreen");
            console.log("tauri.ios.conf.json configuration valid");
          '

  standalone:
    name: Standalone (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Standard macos-15 runners are Apple Silicon (not macos-15-intel).
          - os: macos-15
            platform: mac-arm64
          - os: windows-2025
            platform: windows-x64
          - os: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Native renderer tests on this OS
        run: npx tsx --test tests/pdf-native-render.test.ts tests/pdf-ops.test.ts tests/svg-native-render.test.ts tests/browser-service.test.ts
        env:
          NODE_ENV: test
      - run: npm run build
      # Check the fresh trace before any static copying/curation.
      - run: node scripts/smoke-provider-runtime.mjs
      - name: Cargo tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
